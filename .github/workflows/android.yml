name: Android CI

on:
  push:
    branches: [ "main","github_actions_integration"]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: debug

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE }}
        run:
          echo "$KEYSTORE_BASE64" | tr -d '\n' | base64 --decode > "${{github.workspace}}/keystore-debug.jks"
        shell: bash

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      #- name: Run Unit Tests
      #  run: ./gradlew test

      - name: Build debug Apk
        run:
          ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk